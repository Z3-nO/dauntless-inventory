appId: com.dauntless.materiali.livepreview
productName: Dauntless Inventory Live Preview
artifactName: DauntlessInventoryLive.exe
asar: true
files:
  - main.cjs
  - preload.cjs
  - desktop-updates.cjs
  - desktop-update-manifest.cjs
  - desktop-update-draft.cjs
  - package.json
extraResources:
  - from: .
    to: tool
    filter:
      - "**/*"
      - "!Anteprima*.png"
      - "!Launcher.cs"
      - "!Build.ps1"
      - "!Avvia.*"
      - "!Chiudi.*"
      - "!logs/**/*"
      - "!node_modules/**/*"
      - "!dist/**/*"
win:
  target:
    - target: portable
      arch: x64
  icon: assets/helmet.ico
  signAndEditExecutable: true
  signExecutable: false
portable:
  unpackDirName: dauntless-materiali-live-0131
directories:
  output: dist

compression: normal
